name: Sync Dota 2 tournaments

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/scripts/package-lock.json
      - run: npm install
        working-directory: project/scripts
      - run: node sync-tournaments.mjs
        working-directory: project/scripts
        env:
          PANDASCORE_API_KEY: ${{ secrets.PANDASCORE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
